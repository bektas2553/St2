name: iOS Tweak CI

on:
  workflow_dispatch: # Manuel olarak butona basıp derlemeyi başlatabilmek için

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Theos ve iOS SDK Kurulumu
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          export THEOS=/opt/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          tar -xf iPhoneOS14.5.sdk.tar.xz
          mv iPhoneOS14.5.sdk $THEOS/sdks/
          rm iPhoneOS14.5.sdk.tar.xz

      - name: Tweak Derleme İşlemi
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1

      - name: Derlenen Çıktıyı (Dylib) Kaydet
        uses: actions/upload-artifact@v3
        with:
          name: Standoff2ESP-Dylib
          path: .theos/obj/debug/*.dylib
